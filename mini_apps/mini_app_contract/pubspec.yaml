name: mini_app_contract
description: The host <-> mini-app boundary. Deliberately tiny; both sides depend on this and never on each other.
publish_to: none
version: 1.0.0

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.29.0'

resolution: workspace

# Note what is absent: no feature package, no host app, no domain package.
# This package exists precisely so a mini-app can be built and tested without
# any of them.
dependencies:
  flutter:
    sdk: flutter
  core_kit: ^1.0.0
  core_arch: ^1.0.0
  get_it: ^8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
