name: mini_app_sample
description: Reference mini-app — a paginated list, self-contained, coupled to the host only through mini_app_contract.
publish_to: none
version: 1.0.0

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.29.0'

resolution: workspace

# The dependency list is the point of this package. `mini_app_contract` is the
# only line that touches the host, and there is no `feature_*` dependency at
# all — this mini-app can be dropped into a different app unchanged.
dependencies:
  flutter:
    sdk: flutter
  core_kit: ^1.0.0
  core_arch: ^1.0.0
  core_ui: ^1.0.0
  mini_app_contract: ^1.0.0
  equatable: ^2.0.5
  get_it: ^9.2.1
  meta: ^1.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
