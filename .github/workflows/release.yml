# Release builds, as a thin shell around `make` — same rule as ci.yml.
#
# Nothing here knows a package list, a flavor list or an SDK version. The
# flavors come from `env_config/`, the SDK from `.fvmrc`, and every build step
# is a make target that also works on a laptop. A workflow that can only be
# exercised by pushing a tag is a workflow nobody can debug.
#
# What this does NOT do: upload to Play Console or App Store Connect. That needs
# a signing identity and store credentials, which are per-project secrets this
# base cannot ship. The artifacts are built, checked and attached to the release
# — wiring the upload is one job away and documented at the bottom of this file.

name: Release

on:
  push:
    tags: ['v*']
  # So a release build can be exercised before a tag exists, which is the only
  # way to find out that the release path broke without cutting a real release.
  workflow_dispatch:
    inputs:
      flavor:
        description: Flavor to build
        type: choice
        options: [prod, stg, dev]
        default: prod

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER: flutter
  DART: dart
  FLAVOR: ${{ inputs.flavor || 'prod' }}

jobs:
  # The gate runs again rather than being assumed from the branch build: a tag
  # can point at a commit that never had a green CI run, and "we tested it on
  # main" is how an unbuildable tag reaches a store.
  gate:
    name: make ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Flutter version
        id: sdk
        run: echo "version=$(jq -re .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Materialise env files from the tracked samples
        run: make env
      - run: make ci

  android:
    name: Android (${{ inputs.flavor || 'prod' }})
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Flutter version
        id: sdk
        run: echo "version=$(jq -re .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      # These carry per-project URLs and keys and are gitignored, so a release
      # build on a runner has to create them the same way a fresh clone does.
      # Point this at real secrets before shipping: `make env` copies the
      # *samples*, which are placeholders, not production configuration.
      - name: Materialise env files from the tracked samples
        run: make env

      - run: make aab FLAVOR=$FLAVOR
      - run: make apk FLAVOR=$FLAVOR

      # `--obfuscate --split-debug-info` is on in the Makefile for every release
      # build, which means a crash report is unreadable without these. Losing
      # them is losing the ability to debug the build after it ships, so they
      # are retained far longer than the binaries.
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-info-${{ github.ref_name }}
          path: app/build/debug-info/
          retention-days: 90
          if-no-files-found: error

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.FLAVOR }}-${{ github.ref_name }}
          path: |
            app/build/app/outputs/bundle/release/*.aab
            app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

  ios:
    name: iOS (unsigned)
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Flutter version
        id: sdk
        run: echo "version=$(jq -re .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true
      - name: Materialise env files from the tracked samples
        run: make env

      # Unsigned on purpose. A signing identity is a per-project secret, and
      # this base ships none — but the failures that actually break an iOS
      # release (a plugin with no iOS side, an unresolvable Podfile, a
      # deployment target a dependency outgrew) all happen before signing.
      # Swap in `make ipa FLAVOR=prod` once certificates are configured.
      - run: make ios-nosign FLAVOR=$FLAVOR

  release:
    name: Attach artifacts to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: android-*
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: true

# Store upload, when this project has credentials:
#
#   - uses: r0adkll/upload-google-play@v1
#     with:
#       serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
#       packageName: com.example.app        # `make rename ORG=...` sets this
#       releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
#       track: internal
#
# iOS needs the certificate and provisioning profile imported into a temporary
# keychain first (`apple-actions/import-codesign-certs`), then `make ipa` in
# place of `make ios-nosign`, then `xcrun altool --upload-app`.
