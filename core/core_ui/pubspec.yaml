name: core_ui
description: Design system — tokens, themes, localization scaffolding, shared widgets and overlays.
publish_to: none
version: 1.0.0

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.29.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  core_kit: ^1.0.0
  core_arch: ^1.0.0
  intl: ^0.20.2
  injectable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  injectable_generator: ^3.0.2

flutter:
  generate: true
